# ============================================================================
# 本地开发配置
# 请将「占位值」替换为实际配置后使用
# ============================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agents?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root           # TODO: 替换为实际数据库用户名
    password: 12345678       # TODO: 替换为实际数据库密码
    type: com.zaxxer.hikari.HikariDataSource

  data:
    redis:
      host: localhost
      port: 6379
      password: ''           # TODO: 如有密码请填写
      database: 0
      timeout: 5000ms

# 火山引擎豆包 Ark SDK 配置
volcengine:
  ark-api-key: AK_ID_YOUR_API_KEY_HERE    # TODO: 替换为实际的 Ark API Key
  ark-base-url: "https://ark.cn-beijing.volces.com/api/v3"
  timeout: 120
  connect-timeout: 20
  retry-times: 2

# 微信小程序配置
wechat:
  miniapp:
    app-id: wx12751c57e3949d54             # TODO: 替换为微信小程序 AppID
    app-secret: f977137263249593b243599080004d18        # TODO: 替换为微信小程序 AppSecret
    login-url: "https://api.weixin.qq.com/sns/jscode2session"

# JWT 配置
jwt:
  secret: your-jwt-secret-key-please-change-in-production  # TODO: 替换为实际密钥
  expire-hours: 168

# 阿里云 OSS 配置（知识库文件上传）
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: YOUR_OSS_ACCESS_KEY_ID        # TODO: 替换为实际 AK
    access-key-secret: YOUR_OSS_ACCESS_KEY_SECRET # TODO: 替换为实际 SK
    bucket-name: your-bucket-name                 # TODO: 替换为实际 Bucket
    region: cn-hangzhou
