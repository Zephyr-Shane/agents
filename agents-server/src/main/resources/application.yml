server:
  port: 8080

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agents?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root           # TODO: 替换为实际数据库用户名
    password: 12345678       # TODO: 替换为实际数据库密码
    type: com.zaxxer.hikari.HikariDataSource

  data:
    redis:
      host: localhost
      port: 6379
      password: ''           # TODO: 如有密码请填写
      database: 0
      timeout: 5000ms

  ai:
    openai:
      api-key: api-key    # TODO: 替换为实际的 Ark API Key
      base-url: "https://ark.cn-beijing.volces.com/api"
      chat:
        options:
          model: deepseek-v4-flash-260425
          temperature: 0.6
          max-tokens: 4096
          top-p: 0.8

# JWT 配置
jwt:
  secret: your-jwt-secret-key-please-change-in-production  # TODO: 替换为实际密钥
  expire-hours: 168

# 阿里云 OSS 配置（知识库文件上传）
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: YOUR_OSS_ACCESS_KEY_ID        # TODO: 替换为实际 AK
    access-key-secret: YOUR_OSS_ACCESS_KEY_SECRET # TODO: 替换为实际 SK
    bucket-name: your-bucket-name                 # TODO: 替换为实际 Bucket
    region: cn-hangzhou
